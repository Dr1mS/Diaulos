<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2129"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="960" height="380" rx="16" fill="#0d1117"/>
  <text x="32" y="42" fill="#e6edf3" font-size="20" font-weight="700">Two machines, two networks</text>
  <text x="32" y="64" fill="#8b949e" font-size="13">paired once by hand · outgoing HTTPS only · the relay sees ciphertext</text>

  <!-- machine A -->
  <rect x="32" y="92" width="290" height="250" rx="14" fill="none" stroke="#30363d" stroke-dasharray="6 5"/>
  <text x="50" y="118" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1">YOUR LAPTOP · home network</text>
  <g font-size="13">
    <rect x="50" y="134" width="254" height="44" rx="9" fill="url(#box)" stroke="#d97757"/>
    <text x="66" y="161" fill="#d97757" font-weight="700">claude:review</text>
    <rect x="50" y="188" width="254" height="44" rx="9" fill="url(#box)" stroke="#58a6ff"/>
    <text x="66" y="215" fill="#58a6ff" font-weight="700">agy:web</text>
    <rect x="50" y="270" width="254" height="52" rx="9" fill="url(#box)" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="66" y="293" fill="#e6edf3" font-weight="700">gateway</text>
    <text x="66" y="311" fill="#8b949e" font-size="12">seals · paces · checks the allow list</text>
  </g>
  <path d="M177,232 L177,268" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- machine B -->
  <rect x="638" y="92" width="290" height="250" rx="14" fill="none" stroke="#30363d" stroke-dasharray="6 5"/>
  <text x="656" y="118" fill="#8b949e" font-size="12" font-weight="700" letter-spacing="1">BUILD SERVER · office network</text>
  <g font-size="13">
    <rect x="656" y="134" width="254" height="44" rx="9" fill="url(#box)" stroke="#58a6ff"/>
    <text x="672" y="161" fill="#58a6ff" font-weight="700">agy:ci</text>
    <rect x="656" y="188" width="254" height="44" rx="9" fill="url(#box)" stroke="#d97757"/>
    <text x="672" y="215" fill="#d97757" font-weight="700">claude:ops</text>
    <rect x="656" y="270" width="254" height="52" rx="9" fill="url(#box)" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="672" y="293" fill="#e6edf3" font-weight="700">gateway</text>
    <text x="672" y="311" fill="#8b949e" font-size="12">opens · checks · delivers or refuses</text>
  </g>
  <path d="M783,268 L783,234" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- relay -->
  <rect x="392" y="150" width="176" height="96" rx="48" fill="url(#box)" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="188" fill="#e6edf3" font-size="15" font-weight="700" text-anchor="middle">relay</text>
  <text x="480" y="208" fill="#8b949e" font-size="12" text-anchor="middle">ntfy.sh or your own</text>
  <text x="480" y="226" fill="#8b949e" font-size="12" text-anchor="middle">sees no content</text>

  <path d="M304,292 C360,292 360,214 390,206" stroke="#bc8cff" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M570,206 C600,214 600,292 654,292" stroke="#bc8cff" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <g font-size="12" fill="#bc8cff" font-weight="700">
    <text x="318" y="272">🔒 HTTPS out</text>
    <text x="566" y="262">🔒 HTTPS out</text>
  </g>

  <!-- address and crypto notes -->
  <rect x="340" y="98" width="280" height="34" rx="9" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="120" fill="#e6edf3" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">send remote:server/agy:ci "…"</text>
  <g font-size="12" fill="#8b949e" text-anchor="middle">
    <text x="480" y="290">X25519 pairing · 6-digit check</text>
    <text x="480" y="308">ChaCha20-Poly1305 · one key per direction</text>
    <text x="480" y="326">replies only to the session that wrote</text>
  </g>
</svg>
