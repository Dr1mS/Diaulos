name: tests

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q bridge tests
      - name: Check the shell scripts
        run: bash -n install.sh && bash -n uninstall.sh
      - name: Tests
        run: python -m unittest discover -s tests -v

  windows:
    name: Windows, Python 3.12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q bridge tests
      - name: Tests (the Linux-only ones skip themselves)
        run: python -m unittest discover -s tests -v
